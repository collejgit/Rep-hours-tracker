        html{height:100%;scroll-behavior:smooth}body{min-height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased;background:var(--shell);color:var(--text-dark)}#root{min-height:100vh}input,select,textarea,button{font-family:var(--font)}input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7)}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:4px}

<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const API='/api';
const CATS=[{id:'property_mgmt',label:'Property Management',icon:'🏠'},{id:'repairs',label:'Repairs & Maintenance',icon:'🔧'},{id:'construction',label:'Construction / Improvements',icon:'🏗️'},{id:'travel',label:'Travel (NJ ↔ NC)',icon:'🚗'},{id:'bookings',label:'Booking & Guest Mgmt',icon:'📅'},{id:'records',label:'Records & Accounting',icon:'📋'},{id:'cleaning',label:'Cleaning & Turnover',icon:'🧹'},{id:'communication',label:'Calls / Emails / Texts',icon:'📞'},{id:'shopping',label:'Shopping for Properties',icon:'🛒'},{id:'inspection',label:'Inspections & Walkthroughs',icon:'🔍'},{id:'other',label:'Other RE Activity',icon:'📝'}];
const PROPS=[{id:'all',label:'All Properties'},{id:'salt_house',label:'Salt House'},{id:'kdh',label:'KDH'},{id:'lighthouse',label:'Lighthouse'}];
const EXP_CATS=[{id:'repairs',label:'Repairs & Maintenance',icon:'🔧'},{id:'capital',label:'Capital Improvements',icon:'🏗️'},{id:'supplies',label:'Supplies & Materials',icon:'🛒'},{id:'utilities',label:'Utilities',icon:'💡'},{id:'insurance',label:'Insurance',icon:'🛡️'},{id:'taxes',label:'Property Taxes',icon:'🏛️'},{id:'management',label:'Management Fees',icon:'📋'},{id:'cleaning',label:'Cleaning & Turnover',icon:'🧹'},{id:'travel',label:'Travel',icon:'🚗'},{id:'furnishing',label:'Furnishing & Decor',icon:'🛋️'},{id:'landscaping',label:'Landscaping',icon:'🌿'},{id:'legal',label:'Legal & Professional',icon:'⚖️'},{id:'marketing',label:'Marketing & Advertising',icon:'📣'},{id:'mortgage',label:'Mortgage Interest',icon:'🏦'},{id:'other',label:'Other',icon:'📝'}];
const GOAL=750;
const getToken=()=>localStorage.getItem('rep_token');const setToken=t=>localStorage.setItem('rep_token',t);const clearToken=()=>localStorage.removeItem('rep_token');
async function api(ep,opts={}){const t=getToken();const r=await fetch(`${API}/${ep}`,{...opts,headers:{'Content-Type':'application/json',...(t?{Authorization:`Bearer ${t}`}:{}),...opts.headers}});if(r.status===401){clearToken();return null}if(r.headers.get('content-type')?.includes('text/csv')){const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='export.csv';a.click();URL.revokeObjectURL(u);return{success:true}}return r.json()}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short'})};
const fmtH=h=>{const hr=Math.floor(h),mn=Math.round((h-hr)*60);return mn>0?`${hr}h ${mn}m`:`${hr}h`};
const fmtD=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ══════════════════════════════════════════════════
// CSV UPLOAD COMPONENT (shared)
// ══════════════════════════════════════════════════
function CSVUpload({onUpload,type,templateCols}){
    const[dragging,setDragging]=useState(false);
    const[result,setResult]=useState(null);
    const[uploading,setUploading]=useState(false);
    const fileRef=useRef(null);

    const processFile=async(file)=>{
        setUploading(true);setResult(null);
        const text=await file.text();
        try{
            const r=await api(`${type}/import`,{method:'POST',body:JSON.stringify({csv:text})});
            setResult(r);if(r?.success)onUpload();
        }catch(e){setResult({error:e.message})}
        setUploading(false);
    };
    const handleFile=e=>{const f=e.target.files?.[0];if(f)processFile(f);if(fileRef.current)fileRef.current.value=''};
    const handleDrop=e=>{e.preventDefault();setDragging(false);const f=e.dataTransfer.files?.[0];if(f)processFile(f)};

    const CS={background:'var(--bg-card)',borderRadius:16,border:'1px solid var(--border)',padding:20};
    return(<div style={CS}>
        <div style={{fontSize:15,fontWeight:600,marginBottom:12,color:'var(--text)'}}>📤 Import from CSV</div>
        <div onDragOver={e=>{e.preventDefault();setDragging(true)}} onDragLeave={()=>setDragging(false)} onDrop={handleDrop}
            style={{padding:24,borderRadius:12,border:`2px dashed ${dragging?'var(--accent)':'var(--border-light)'}`,textAlign:'center',
                background:dragging?'rgba(99,102,241,.05)':'transparent',transition:'all .2s',marginBottom:12}}>
            <label className="tap" style={{cursor:'pointer',display:'block'}}>
                <div style={{fontSize:28,marginBottom:6}}>{uploading?'⏳':'📄'}</div>
                <div style={{fontSize:13,color:'var(--text-dim)',fontWeight:600}}>{uploading?'Importing…':'Drop CSV file here or click to browse'}</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>Max 2,000 rows per upload</div>
                <input ref={fileRef} type="file" accept=".csv,.txt" onChange={handleFile} style={{display:'none'}} disabled={uploading}/>
            </label>
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',lineHeight:1.6}}>
            <strong style={{color:'var(--text-dim)'}}>Expected columns:</strong> {templateCols}
        </div>
        {result&&<div style={{marginTop:12,padding:12,borderRadius:10,
            background:result.success?'rgba(52,211,153,.08)':'rgba(248,113,113,.08)',
            border:`1px solid ${result.success?'rgba(52,211,153,.2)':'rgba(248,113,113,.2)'}`,fontSize:13}}>
            {result.success?<div style={{color:'var(--green)'}}>✓ Imported {result.imported} of {result.total} rows{result.skipped>0&&<span> ({result.skipped} skipped)</span>}
                {result.errors?.length>0&&<div style={{marginTop:6,fontSize:11,color:'var(--yellow)'}}>{result.errors.map((e,i)=><div key={i}>{e}</div>)}</div>}</div>
            :<div style={{color:'var(--red)'}}>✕ {result.error||'Upload failed'}</div>}
        </div>}
    </div>);
}

        </div></header>)}
function HeroBanner(){return(<div style={{position:'relative',height:'85vh',minHeight:500,overflow:'hidden',background:'linear-gradient(135deg, #1a3a5c 0%, #2d5f8a 50%, #6ba5a5 100%)'}}>

            <div className="fu" style={{fontSize:13,letterSpacing:4,textTransform:'uppercase',color:'rgba(255,255,255,.6)',marginBottom:16}}>The Outer Banks, North Carolina</div>

            <p className="fu fu2" style={{fontSize:17,maxWidth:520,lineHeight:1.6,color:'rgba(255,255,255,.8)',marginBottom:32}}>Three exceptional beachfront homes in Corolla and Kill Devil Hills —<br/>managed by Twiddy & Company since 1978.</p>

        </div></div>)}
function PropertyCard({prop,index}){const hasPhotos=prop.photos&&prop.photos.length>0;const pc=['#2d5f8a','#6ba5a5','#c4704b'];const[pi,setPi]=useState(0);const np=hasPhotos?prop.photos.length:0;
    return(<div className={`fu fu${index+1}`} style={{background:'#fff',borderRadius:16,overflow:'hidden',boxShadow:'0 4px 24px rgba(0,0,0,.06)',transition:'transform .3s,box-shadow .3s'}} onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow='0 12px 40px rgba(0,0,0,.1)'}} onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='0 4px 24px rgba(0,0,0,.06)'}}>

                <button onClick={e=>{e.stopPropagation();setPi(i=>(i+1)%np)}} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',width:36,height:36,borderRadius:'50%',border:'none',background:'rgba(0,0,0,.4)',color:'#fff',fontSize:18,cursor:'pointer',zIndex:2}}>›</button>
                <div style={{position:'absolute',bottom:48,left:'50%',transform:'translateX(-50%)',display:'flex',gap:5,zIndex:2}}>{prop.photos.map((_,i)=><button key={i} onClick={e=>{e.stopPropagation();setPi(i)}} style={{width:i===pi?16:7,height:7,borderRadius:4,border:'none',background:i===pi?'#fff':'rgba(255,255,255,.5)',cursor:'pointer',padding:0}}/>)}</div></>}
            <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'40px 24px 16px',background:'linear-gradient(transparent,rgba(0,0,0,.6))'}}>
                <div style={{display:'flex',gap:8}}><span style={{padding:'4px 10px',borderRadius:20,background:'rgba(255,255,255,.2)',backdropFilter:'blur(4px)',fontSize:11,color:'#fff',fontWeight:600}}>{prop.position}</span>
                    {prop.petFriendly&&<span style={{padding:'4px 10px',borderRadius:20,background:'rgba(255,255,255,.2)',backdropFilter:'blur(4px)',fontSize:11,color:'#fff',fontWeight:600}}>🐕 Pet-Friendly</span>}
                    {np>1&&<span style={{padding:'4px 10px',borderRadius:20,background:'rgba(255,255,255,.15)',fontSize:11,color:'rgba(255,255,255,.8)'}}>{pi+1}/{np}</span>}</div></div></div>
        <div style={{padding:'24px 24px 20px'}}>
            <div style={{fontSize:11,color:'var(--seafoam)',fontWeight:600,letterSpacing:2,textTransform:'uppercase',marginBottom:6}}>{prop.location} · {prop.code}</div>

function AdminLogin({onLogin}){const[pw,setPw]=useState('');const[err,setErr]=useState('');const[ld,setLd]=useState(false);
    const go=async()=>{setLd(true);setErr('');try{const r=await api('auth',{method:'POST',body:JSON.stringify({password:pw})});if(r?.token){setToken(r.token);onLogin()}else setErr('Invalid password')}catch(e){setErr('Connection error')}setLd(false)};
    useEffect(()=>{document.body.classList.add('admin-mode');return()=>document.body.classList.remove('admin-mode')},[]);
    return(<div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24,background:'radial-gradient(ellipse at 50% 30%,rgba(99,102,241,.08) 0%,transparent 60%),var(--bg)'}}>
        <div className="fu" style={{width:'100%',maxWidth:360,textAlign:'center'}}>
            <div style={{fontSize:40,marginBottom:8}}>🔒</div><h1 style={{fontSize:22,fontWeight:700,letterSpacing:-.5,marginBottom:4,color:'var(--text)'}}>Admin Panel</h1>
            <p style={{fontSize:12,color:'var(--text-muted)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:32}}>Colletti Coastal Properties</p>
            <input type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} autoFocus style={{width:'100%',padding:'14px 18px',borderRadius:12,border:'1px solid var(--border-light)',background:'var(--bg-card)',color:'var(--text)',fontSize:16,outline:'none',marginBottom:12,boxSizing:'border-box'}}/>
            <button onClick={go} disabled={ld} className="tap" style={{width:'100%',padding:14,borderRadius:12,border:'none',background:'linear-gradient(135deg,var(--accent),#4f46e5)',color:'#fff',fontSize:15,fontWeight:600,cursor:'pointer',boxShadow:'0 4px 24px var(--accent-glow)',opacity:ld?.6:1}}>{ld?'Signing in…':'Sign In'}</button>
            {err&&<p style={{marginTop:12,fontSize:13,color:'var(--red)'}}>{err}</p>}</div></div>)}

function Ring({cur,goal,year}){const pct=Math.min(cur/goal,1),r=78,c=Math.PI*2*r,off=c-pct*c;const now=new Date(),isCur=now.getFullYear()===year;const doy=isCur?Math.floor((now-new Date(year,0,1))/864e5)+1:365;const onTrack=pct>=(doy/365)*.85;const color=pct>=1?'var(--green)':onTrack?'var(--yellow)':'var(--red)';const rem=Math.max(0,goal-cur);const wks=isCur?Math.max(1,Math.ceil((new Date(year,11,31)-now)/(864e5*7))):0;
    return(<div style={{textAlign:'center'}}><div style={{position:'relative',width:186,height:186,margin:'0 auto 16px'}}><svg width="186" height="186" viewBox="0 0 186 186"><circle cx="93" cy="93" r={r} fill="none" stroke="rgba(255,255,255,.05)" strokeWidth="10"/><circle cx="93" cy="93" r={r} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} transform="rotate(-90 93 93)" style={{transition:'stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)'}}/></svg>
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}><span style={{fontFamily:'var(--mono)',fontSize:34,fontWeight:700}}>{cur.toFixed(1)}</span><span style={{fontSize:12,color:'var(--text-muted)',letterSpacing:1}}>of {goal} hrs</span>{pct>=1&&<span style={{fontSize:11,color:'var(--green)',fontWeight:700,marginTop:2}}>✓ GOAL MET</span>}</div></div>
        {rem>0&&isCur&&<div style={{padding:'10px 16px',borderRadius:10,background:color+'11',border:`1px solid ${color}22`,fontSize:13,color:color+'cc'}}>{rem.toFixed(1)} hrs remaining · ~{(rem/wks).toFixed(1)} hrs/week</div>}</div>)}
function MChart({monthly}){const d=Array.from({length:12},(_,i)=>{const f=monthly.find(m=>m.month===i+1);return f?parseFloat(f.total):0});const mx=Math.max(...d,1);
    return(<div style={{display:'flex',alignItems:'flex-end',gap:5,height:90}}>{d.map((v,i)=><div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}><div style={{width:'100%',maxWidth:30,borderRadius:4,height:Math.max(3,(v/mx)*68),background:v>0?'linear-gradient(to top,var(--accent),var(--accent-light))':'rgba(255,255,255,.04)',transition:'height .5s ease'}} title={`${MN[i]}: ${v.toFixed(1)}h`}/><span style={{fontSize:9,color:'var(--text-faint)'}}>{MN[i].charAt(0)}</span></div>)}</div>)}

function PhotoManager(){const[ap,setAp]=useState('salt_house');const[photos,setPhotos]=useState([]);const[ld,setLd]=useState(true);const[ul,setUl]=useState(false);const[di,setDi]=useState(null);const[doi,setDoi]=useState(null);const[ec,setEc]=useState(null);const[cd,setCd]=useState(null);const fr=useRef(null);

    const hdrop=async idx=>{if(di===null||di===idx)return;const np=[...photos];const[m]=np.splice(di,1);np.splice(idx,0,m);setPhotos(np);setDi(null);setDoi(null);const t=getToken();await fetch(`${API}/photos/reorder`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({orders:np.map((p,i)=>({id:p.id,sort_order:i+1}))})})};
    const CS={background:'var(--bg-card)',borderRadius:16,border:'1px solid var(--border)',padding:20};const api_=PROP_LIST.find(p=>p.key===ap);

        <div className="fu" style={CS}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><div><div style={{fontSize:15,fontWeight:600}}>{api_?.name}</div><div style={{fontSize:12,color:'var(--text-muted)'}}>{photos.length} photos · Drag to reorder</div></div>
            <label className="tap" style={{padding:'8px 16px',borderRadius:8,background:'linear-gradient(135deg,var(--accent),#4f46e5)',color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',boxShadow:'0 2px 12px var(--accent-glow)',opacity:ul?.5:1}}>{ul?'Uploading…':'+ Upload Photos'}<input ref={fr} type="file" accept="image/*" multiple onChange={hu} style={{display:'none'}}/></label></div>
            {ld?<div style={{textAlign:'center',padding:40,color:'var(--text-muted)',animation:'pulse 1.5s infinite'}}>Loading…</div>

                    :<button onClick={()=>setEc({id:p.id,caption:p.caption||''})} style={{width:'100%',padding:'4px 6px',borderRadius:4,border:'none',background:'rgba(255,255,255,.06)',color:'var(--text-muted)',fontSize:11,cursor:'pointer',textAlign:'left',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.caption||'Add caption…'}</button>}</div></div>)}</div>}

// ── Expense Tracker ──
function ExpenseTracker({year:parentYear}){

    const[fCat,setFCat]=useState('all');const[fProp,setFProp]=useState('all');
    const[yoyData,setYoyData]=useState(null);const[yoyLoading,setYoyLoading]=useState(false);
    const[yoyY1,setYoyY1]=useState(parentYear-1);const[yoyY2,setYoyY2]=useState(parentYear);

    const fetch_=useCallback(async()=>{setLd(true);const r=await api(`expenses?year=${year}`);if(r)setData(r);setLd(false)},[year]);
    useEffect(()=>{fetch_()},[fetch_]);

    const fetchYoy=useCallback(async()=>{setYoyLoading(true);const r=await api(`expenses/yoy?year1=${yoyY1}&year2=${yoyY2}`);if(r)setYoyData(r);setYoyLoading(false)},[yoyY1,yoyY2]);
    useEffect(()=>{if(view==='yoy')fetchYoy()},[view,fetchYoy]);

    const expenses=data?.expenses||[];const sm=data?.summary||{total_amount:0,total_count:0};const cats=data?.categories||[];const props=data?.properties||[];
    const filtered=expenses.filter(e=>fCat==='all'||e.category===fCat).filter(e=>fProp==='all'||e.property===fProp);
    const filtTotal=filtered.reduce((s,e)=>s+e.amount,0);

    const handleSave=async exp=>{if(exp.id){await api('expenses',{method:'PUT',body:JSON.stringify(exp)})}else{await api('expenses',{method:'POST',body:JSON.stringify(exp)})}setEdit(null);setView('summary');fetch_()};
    const handleDel=async id=>{await api(`expenses/${id}`,{method:'DELETE'});fetch_()};
    const handleExport=()=>{const t=getToken();fetch(`${API}/expenses/export?year=${year}`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`Expenses_${year}.csv`;a.click();URL.revokeObjectURL(u)})};

    const CS={background:'var(--bg-card)',borderRadius:16,border:'1px solid var(--border)',padding:20};
    const navItems=[{id:'summary',label:'Summary',icon:'📊'},{id:'add',label:'Add',icon:'➕'},{id:'import',label:'Import',icon:'📤'},{id:'history',label:'History',icon:'📜'},{id:'yoy',label:'YoY',icon:'📈'}];

        </div>
        {/* Sub-nav */}
        <div style={{display:'flex',gap:4}}>{navItems.map(n=><button key={n.id} onClick={()=>{setView(n.id);if(n.id!=='add')setEdit(null)}} className="tap"
            style={{flex:1,padding:'8px 4px',borderRadius:8,border:`1px solid ${view===n.id?'var(--accent)':'var(--border)'}`,background:view===n.id?'rgba(99,102,241,.1)':'var(--bg-card)',color:view===n.id?'var(--accent-soft)':'var(--text-dim)',fontSize:11,fontWeight:view===n.id?600:400,cursor:'pointer',fontFamily:'var(--font)',display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
            <span>{n.icon}</span>{n.label}</button>)}</div>

        {ld&&!data?<div style={{textAlign:'center',padding:60,color:'var(--text-muted)',animation:'pulse 1.5s infinite'}}>Loading…</div>:<>

        {view==='summary'&&<div style={{display:'flex',flexDirection:'column',gap:14}}>

                <div style={{fontSize:12,color:'var(--text-muted)',marginTop:4}}>{sm.total_count} expense{sm.total_count!==1?'s':''}</div></div>

                    <div style={{flex:1}}><label style={{fontSize:11,color:'var(--text-muted)',display:'block',marginBottom:4}}>YEAR 2</label>
                        <input type="number" value={yoyY2} onChange={e=>setYoyY2(parseInt(e.target.value))} style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid var(--border-light)',background:'var(--bg-card)',color:'var(--text)',fontSize:14,outline:'none',textAlign:'center',fontFamily:'var(--mono)'}}/></div>

                    </div>

                                    <div style={{flex:1,height:Math.max(2,(v2/mx)*70),borderRadius:2,background:'var(--accent-light)'}} title={`${MN[i]} ${yoyData.year2.year}: $${fmtD(v2)}`}/></div>

                        <span><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'var(--accent-light)',marginRight:4,verticalAlign:'middle'}}/>{yoyData.year2.year}</span></div>

                        return(<div key={c.category} style={{display:'grid',gridTemplateColumns:'1fr auto auto auto',gap:8,alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:12}}>

                                {c.diff>0?'+':''}{pct!==null?`${pct.toFixed(0)}%`:c.year2>0?'NEW':'—'}</span></div>)})}
                </div>:<div style={{textAlign:'center',padding:30,color:'var(--text-faint)'}}>Select years above</div>}
            </div>
        </div>}
        </>}
    </div>)}

function ExpenseForm({onSave,edit,onCancel}){const[dt,setDt]=useState(edit?.expense_date||today());const[amt,setAmt]=useState(edit?String(edit.amount):'');const[cat,setCat]=useState(edit?.category||'');const[prop,setProp]=useState(edit?.property||'all');const[vendor,setVendor]=useState(edit?.vendor||'');const[desc,setDesc]=useState(edit?.description||'');const[rf,setRf]=useState(edit?.receipt_filename||null);const[ul,setUl]=useState(false);const[pa,setPa]=useState(false);const[sv,setSv]=useState(false);const fr=useRef(null);
    useEffect(()=>{if(edit){setDt(edit.expense_date);setAmt(String(edit.amount));setCat(edit.category);setProp(edit.property);setVendor(edit.vendor||'');setDesc(edit.description||'');setRf(edit.receipt_filename||null)}else{reset()}},[edit]);
    const reset=()=>{setDt(today());setAmt('');setCat('');setVendor('');setDesc('');setRf(null)};
    const hru=async e=>{const file=e.target.files?.[0];if(!file)return;setUl(true);const t=getToken();const fd=new FormData();fd.append('receipt',file);
        try{const r=await fetch(`${API}/expenses/upload-receipt`,{method:'POST',headers:{Authorization:`Bearer ${t}`},body:fd});
            if(r.ok){const d=await r.json();setRf(d.filename);setPa(true);
                try{const ocrRes=await fetch(`${API}/expenses/ocr`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({filename:d.filename})});
                    if(ocrRes.ok){const od=await ocrRes.json();if(od.parsed){const p=od.parsed;if(p.date)setDt(p.date);if(p.amount)setAmt(String(p.amount));if(p.vendor)setVendor(p.vendor);if(p.description)setDesc(p.description);if(p.category&&EXP_CATS.find(c=>c.id===p.category))setCat(p.category)}}
                    else{console.error('OCR error:',await ocrRes.text())}}catch(oe){console.error('OCR error:',oe)}setPa(false)}
        }catch(err){console.error(err)}setUl(false);if(fr.current)fr.current.value=''};
    const go=async()=>{if(!dt||!amt||!cat)return;setSv(true);const p={expense_date:dt,amount:parseFloat(amt),category:cat,property:prop,vendor,description:desc,receipt_filename:rf};if(edit)p.id=edit.id;await onSave(p);setSv(false);if(!edit)reset()};
    const IS={width:'100%',padding:'12px 14px',borderRadius:10,border:'1px solid var(--border-light)',background:'var(--bg-card)',color:'var(--text)',fontSize:15,outline:'none',boxSizing:'border-box'};const LS={fontSize:11,color:'var(--text-muted)',marginBottom:5,display:'block',letterSpacing:.8,textTransform:'uppercase'};const CS={background:'var(--bg-card)',borderRadius:16,border:'1px solid var(--border)',padding:20};
    return(<div className="fu" style={CS}><div style={{fontSize:16,fontWeight:600,marginBottom:18}}>{edit?'Edit Expense':'Add Expense'}</div>
        <div style={{marginBottom:16,padding:16,borderRadius:12,border:'2px dashed var(--border-light)',textAlign:'center',background:rf?'rgba(99,102,241,.05)':'transparent'}}>
            {rf?<div><div style={{fontSize:13,color:'var(--accent-soft)',fontWeight:600,marginBottom:4}}>✓ Receipt attached</div><img src={`/uploads/${rf}`} style={{maxWidth:'100%',maxHeight:120,borderRadius:8,marginBottom:8,objectFit:'contain'}}/><div><button onClick={()=>setRf(null)} style={{fontSize:11,color:'var(--text-muted)',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Remove</button></div></div>
            :<label className="tap" style={{cursor:'pointer',display:'block'}}><div style={{fontSize:28,marginBottom:6}}>{ul?'⏳':pa?'🔍':'📸'}</div><div style={{fontSize:13,color:'var(--text-dim)',fontWeight:600}}>{ul?'Uploading…':pa?'Reading receipt with AI…':'Upload a Receipt'}</div><div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>Photo will be auto-read to fill in fields</div><input ref={fr} type="file" accept="image/*" onChange={hru} style={{display:'none'}} disabled={ul||pa}/></label>}</div>
        {pa&&<div style={{marginBottom:16,padding:12,borderRadius:10,background:'rgba(99,102,241,.08)',border:'1px solid rgba(99,102,241,.15)',textAlign:'center',fontSize:13,color:'var(--accent-soft)',animation:'pulse 1.5s infinite'}}>🔍 AI is reading your receipt…</div>}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}><div><label style={LS}>Date</label><input type="date" value={dt} onChange={e=>setDt(e.target.value)} style={IS}/></div><div><label style={LS}>Amount ($)</label><input type="number" inputMode="decimal" step="0.01" min="0" placeholder="0.00" value={amt} onChange={e=>setAmt(e.target.value)} style={IS}/></div></div>
        <div style={{marginBottom:16}}><label style={LS}>Vendor / Payee</label><input type="text" placeholder="e.g., Home Depot" value={vendor} onChange={e=>setVendor(e.target.value)} style={IS}/></div>
        <div style={{marginBottom:16}}><label style={LS}>Category</label><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(145px,1fr))',gap:6}}>{EXP_CATS.map(c=><button key={c.id} onClick={()=>setCat(c.id)} className="tap" style={{padding:'9px 10px',borderRadius:9,border:`1px solid ${cat===c.id?'var(--accent)':'var(--border)'}`,background:cat===c.id?'rgba(99,102,241,.12)':'var(--bg-card)',color:cat===c.id?'var(--accent-soft)':'var(--text-dim)',fontSize:12,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:6,fontFamily:'var(--font)'}}><span style={{fontSize:14}}>{c.icon}</span><span style={{lineHeight:1.2}}>{c.label}</span></button>)}</div></div>
        <div style={{marginBottom:16}}><label style={LS}>Property</label><select value={prop} onChange={e=>setProp(e.target.value)} style={{...IS,appearance:'auto'}}>{PROPS.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}</select></div>
        <div style={{marginBottom:16}}><label style={LS}>Description</label><textarea rows={2} placeholder="What was this expense for?" value={desc} onChange={e=>setDesc(e.target.value)} style={{...IS,resize:'vertical',lineHeight:1.5}}/></div>
        <div style={{display:'flex',gap:10}}><button onClick={go} disabled={sv} className="tap" style={{flex:1,padding:'14px 20px',borderRadius:12,border:'none',background:'linear-gradient(135deg,var(--accent),#4f46e5)',color:'#fff',fontSize:15,fontWeight:600,cursor:'pointer',boxShadow:'0 4px 24px var(--accent-glow)',opacity:sv?.6:1,fontFamily:'var(--font)'}}>{sv?'Saving…':edit?'Update':'✓ Save Expense'}</button>
            {edit&&<button onClick={onCancel} className="tap" style={{padding:'14px 20px',borderRadius:12,border:'1px solid var(--border-light)',background:'transparent',color:'var(--text-dim)',fontSize:15,cursor:'pointer'}}>Cancel</button>}</div></div>)}

function ExpenseRow({e,onEdit,onDel}){const[cf,setCf]=useState(false);const ct=EXP_CATS.find(c=>c.id===e.category);const pr=PROPS.find(p=>p.id===e.property);

function AdminPanel({onLogout,onBack}){const[section,setSection]=useState('hours');const[view,setView]=useState('dashboard');const[year,setYear]=useState(new Date().getFullYear());const[data,setData]=useState(null);const[ld,setLd]=useState(true);const[edit,setEdit]=useState(null);const[fCat,setFCat]=useState('all');const[fProp,setFProp]=useState('all');

                    <div className="fu" style={CS}><Ring cur={th} goal={GOAL} year={year}/><div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginTop:18,textAlign:'center'}}>{[{v:sm.unique_days,l:'Days'},{v:sm.total_entries,l:'Entries'},{v:parseFloat(sm.total_mileage)>0?Number(sm.total_mileage).toLocaleString():'—',l:'Miles'}].map((s,i)=><div key={i}><div style={{fontFamily:'var(--mono)',fontSize:20,fontWeight:700,color:'var(--text)'}}>{s.v}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{s.l}</div></div>)}</div></div>
                    <div className="fu fu1" style={CS}><div style={TL}>Monthly Distribution</div><MChart monthly={monthly}/></div>
                    {cats.length>0&&<div className="fu fu2" style={CS}><div style={TL}>Top Categories</div>{cats.slice(0,5).map(c=>{const ct=CATS.find(x=>x.id===c.category);return(<div key={c.category} style={{display:'flex',alignItems:'center',gap:10,marginBottom:11}}><span style={{fontSize:16,flexShrink:0}}>{ct?.icon||'📝'}</span><div style={{flex:1}}><div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}><span style={{color:'var(--text-dim)'}}>{ct?.label||c.category}</span><span style={{fontFamily:'var(--mono)',color:'var(--accent-soft)',fontWeight:600,fontSize:12}}>{fmtH(parseFloat(c.total))}</span></div><div style={{height:4,borderRadius:2,background:'rgba(255,255,255,.04)'}}><div style={{height:'100%',borderRadius:2,background:'linear-gradient(90deg,var(--accent),var(--accent-light))',width:`${(parseFloat(c.total)/th)*100}%`}}/></div></div></div>)})}</div>}
                    <button onClick={exp} className="tap fu fu3" style={{width:'100%',padding:13,borderRadius:12,border:'1px solid var(--border-light)',background:'var(--bg-card)',color:'var(--text-dim)',fontSize:14,cursor:'pointer',fontWeight:500,fontFamily:'var(--font)'}}>📥 Export {year} CSV</button></div>}
                {view==='add'&&<EForm onSave={save} edit={edit} onCancel={()=>{setEdit(null);setView('dashboard')}}/>}
                {view==='import'&&<CSVUpload type="entries" onUpload={fetch_} templateCols="Date, Hours, Category, Property, Description, Mileage"/>}
                {view==='history'&&<div style={{display:'flex',flexDirection:'column',gap:8}}>
                    <div style={{display:'flex',gap:8}}><select value={fCat} onChange={e=>setFCat(e.target.value)} style={{flex:1,padding:'9px 10px',borderRadius:9,border:'1px solid var(--border-light)',background:'var(--bg-card)',color:'var(--text)',fontSize:13,fontFamily:'var(--font)'}}><option value="all">All Categories</option>{CATS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}</select>
                        <select value={fProp} onChange={e=>setFProp(e.target.value)} style={{flex:1,padding:'9px 10px',borderRadius:9,border:'1px solid var(--border-light)',background:'var(--bg-card)',color:'var(--text)',fontSize:13,fontFamily:'var(--font)'}}>{PROPS.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}</select></div>
                    <div style={{fontSize:12,color:'var(--text-faint)',padding:'0 2px'}}>{filtered.length} entries · {fmtH(filtH)} total</div>
                    {filtered.length===0?<div className="fu" style={{textAlign:'center',padding:50,color:'var(--text-faint)'}}>No entries</div>:filtered.map(e=><ERow key={e.id} e={e} onEdit={en=>{setEdit(en);setView('add')}} onDel={del}/>)}</div>}
                {view==='breakdown'&&<div style={{display:'flex',flexDirection:'column',gap:14}}>
                    {cats.length===0?<div className="fu" style={{textAlign:'center',padding:50,color:'var(--text-faint)'}}>No data</div>:<>
                    <div className="fu" style={CS}><div style={{fontSize:14,fontWeight:600,marginBottom:16}}>Category Breakdown — {year}</div>{cats.map(c=>{const ct=CATS.find(x=>x.id===c.category);return(<div key={c.category} style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{fontSize:13,color:'var(--text-dim)'}}>{ct?.icon} {ct?.label||c.category}</span><span style={{fontFamily:'var(--mono)',fontSize:13,fontWeight:700,color:'var(--accent-soft)'}}>{fmtH(parseFloat(c.total))}</span></div><div style={{height:8,borderRadius:4,background:'rgba(255,255,255,.04)'}}><div style={{height:'100%',borderRadius:4,background:'linear-gradient(90deg,var(--accent),var(--accent-light))',width:`${(parseFloat(c.total)/parseFloat(cats[0].total))*100}%`}}/></div><div style={{fontSize:11,color:'var(--text-faint)',marginTop:3}}>{((parseFloat(c.total)/th)*100).toFixed(1)}% · {c.entry_count} entries</div></div>)})}</div>
                    <div className="fu fu1" style={CS}><div style={{fontSize:14,fontWeight:600,marginBottom:14}}>By Property</div>{props.map(p=>{const pr=PROPS.find(x=>x.id===p.property);return(<div key={p.property} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--border)'}}><span style={{fontSize:13,color:'var(--text-dim)'}}>{pr?.label||p.property}</span><span style={{fontFamily:'var(--mono)',fontSize:13,fontWeight:600,color:'var(--accent-soft)'}}>{fmtH(parseFloat(p.total))}</span></div>)})}</div></>}</div>}
            </>}</>}
            {section==='photos'&&<PhotoManager/>}
            {section==='expenses'&&<ExpenseTracker year={year}/>}
        </div>
        {section==='hours'&&<div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:600,display:'flex',background:'rgba(12,12,20,.92)',backdropFilter:'blur(24px)',borderTop:'1px solid var(--border)',padding:'8px 0 calc(8px + env(safe-area-inset-bottom,0px))',zIndex:100}}>
            {hourNav.map(n=><button key={n.id} onClick={()=>{setView(n.id);if(n.id!=='add')setEdit(null);if(n.id==='dashboard'||n.id==='history')fetch_()}} className="tap" style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'6px 4px',border:'none',background:'transparent',cursor:'pointer',color:view===n.id?'var(--accent-soft)':'var(--text-faint)',fontFamily:'var(--font)'}}><span style={{fontSize:18}}>{n.icon}</span><span style={{fontSize:9,fontWeight:view===n.id?600:400}}>{n.label}</span></button>)}</div>}
    </div>)}

// ── Root App ──
function App(){const[mode,setMode]=useState('public');const authed=!!getToken();
    const goAdmin=()=>{if(authed)setMode('admin');else setMode('login')};const goPublic=()=>{setMode('public');document.body.classList.remove('admin-mode')};
    return(<>{mode==='public'&&<PublicSite onAdmin={goAdmin}/>}{mode==='login'&&<AdminLogin onLogin={()=>setMode('admin')}/>}{mode==='admin'&&(authed?<AdminPanel onLogout={()=>setMode('public')} onBack={goPublic}/>:<AdminLogin onLogin={()=>setMode('admin')}/>)}</>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
